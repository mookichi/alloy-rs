[package]
name = "alloy-ipasir"
description = "IPASIR-compatible SAT solver interface backed by pluggable Rust solvers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "alloy_ipasir"

[features]
default = ["cadical", "splr"]
cadical = ["dep:cadical"]
splr = ["dep:splr"]
jni = ["dep:jni"]

[dependencies]
cadical = { version = "0.1.16", optional = true }
jni = { version = "0.22.4", optional = true }
splr = { version = "0.19.0", optional = true }

[dev-dependencies]
libloading = "0.8"
